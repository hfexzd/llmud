<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博修仙 MUD</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f3f3; }
        #status-bar { background: #333; color: #fff; padding: 10px; font-size: 13px; display: flex; justify-content: space-around; position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 10; }
        #chat-container { padding: 50px 10px 70px 10px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; height: calc(100% - 120px); }
        .msg { display: flex; margin-bottom: 8px; }
        .msg.user { justify-content: flex-end; }
        .bubble { max-width: 70%; padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.system .bubble { background-color: #fff; color: #000; border: 1px solid #e0e0e0; }
        .msg.user .bubble { background-color: #95ec69; color: #000; }
        #input-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #f7f7f7; border-top: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box; }
        #user-input { flex: 1; height: 36px; border: none; border-radius: 4px; padding: 0 10px; font-size: 15px; outline: none; }
        #send-btn { width: 60px; height: 36px; background: #07c160; color: white; border: none; border-radius: 4px; margin-left: 10px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status-bar">
        <span id="p-loc">地点: 加载中...</span>
        <span id="p-level">境界: 加载中...</span>
        <span id="p-spirit">灵力: 0</span>
    </div>

    <div id="chat-container">
        <div class="msg system"><div class="bubble">【系统】你睁开眼，发现自己正躺在柴房的硬板床上。四周弥漫着霉味，窗外传来师兄们练剑的呼喊声。你想做什么？（试着输入：偷偷溜去后山、或者在原地开始修炼）</div></div>
    </div>

    <div id="input-bar">
        <input type="text" id="user-input" placeholder="输入你的任意骚操作..." autocomplete="off">
        <button id="send-btn" onclick="sendAction()">发送</button>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8001"; // 如果部署到服务器，记得改成本机/服务器IP

        // 刷新上方看板的数值
        async function updateStatus() {
            const res = await fetch(`${API_URL}/player/status`);
            const data = await res.json();
            document.getElementById('p-loc').innerText = `地点: ${data.location}`;
            document.getElementById('p-level').innerText = `境界: ${data.level}`;
            document.getElementById('p-spirit').innerText = `灵力: ${data.spirit_power}`;
        }

        async function sendAction() {
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';

            const container = document.getElementById('chat-container');
            
            // 1. 渲染用户发送的消息
            container.innerHTML += `<div class="msg user"><div class="bubble">${text}</div></div>`;
            container.scrollTop = container.scrollHeight;

            // 2. 创建一个空的 AI 回复气泡，准备接收流式文本
            const aiMsgEl = document.createElement('div');
            aiMsgEl.className = 'msg system';
            const aiBubbleEl = document.createElement('div');
            aiBubbleEl.className = 'bubble';
            aiBubbleEl.innerText = '正在思考...';
            aiMsgEl.appendChild(aiBubbleEl);
            container.appendChild(aiMsgEl);

            try {
                // 3. 请求后端并处理 Stream 流
                const response = await fetch(`${API_URL}/game/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let isFirstChunk = true;
                let fullText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;

                    if (isFirstChunk) {
                        aiBubbleEl.innerText = ''; // 清除“正在思考”
                        isFirstChunk = false;
                    }

                    // 实时把大模型吐出的字符打在屏幕上
                    aiBubbleEl.innerText = fullText;
                    container.scrollTop = container.scrollHeight;
                }

                // 4. 流式结束后，因为大模型返回的是带JSON的数据，我们提取其中的 story 字段展示给玩家看
                try {
                    // 兼容过滤 markdown
                    let cleanJson = fullText.replace(/```json/g, "").replace(/```/g, "").trim();
                    const resultObj = JSON.parse(cleanJson);
                    aiBubbleEl.innerText = resultObj.story; // 只展示干净的剧情文本
                } catch(e) {
                    // 如果AI没严格按JSON返回，则直接兜底展示全文
                    console.log("解析剧情JSON失败，直接展示原文字", e);
                }

                // 5. 剧情演进完毕后，刷新一次顶部的真实代码数值
                await updateStatus();

            } catch (err) {
                aiBubbleEl.innerText = "【系统错误】传信飞鸽在半路被雷劈了，请重试。";
            }
        }

        // 页面初始化加载数值
        updateStatus();
    </script>
</body>
</html>
