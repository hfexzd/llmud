version: "3.9"

services:
  game:
    build: .
    container_name: llmud
    ports:
      - "8001:8001"
    volumes:
      # Persist the SQLite database outside the container
      - llmud_data:/app/data
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLMUD_DB_PATH=/app/data/llmud.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/player/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  llmud_data:
