<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>修仙 MUD</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f3f3; }
        #status-bar { background: linear-gradient(135deg, #2d1b4e, #4a2d6e); color: #fff; padding: 8px 12px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 10; align-items: center; }
        .stat { white-space: nowrap; }
        .stat-label { color: #b8a0d4; }
        .stat-value { font-weight: bold; }
        #favorability-bar { display: none; width: 100%; background: rgba(255,255,255,0.15); border-radius: 8px; height: 4px; margin-top: 2px; }
        #favorability-fill { height: 100%; background: #ff6b9d; border-radius: 8px; transition: width 0.3s; }
        #chat-container { padding: 100px 10px 70px 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; height: calc(100% - 170px); }
        .msg { display: flex; margin-bottom: 6px; }
        .msg.user { justify-content: flex-end; }
        .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .msg.system .bubble { background-color: #fff; color: #333; border: 1px solid #e0e0e0; }
        .msg.user .bubble { background-color: #95ec69; color: #000; }
        .battle-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 1px solid #4a2d6e; border-radius: 12px; padding: 12px; margin: 6px 0; color: #fff; }
        .battle-card h3 { margin: 0 0 8px 0; font-size: 14px; color: #ff6b9d; }
        .battle-row { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; }
        .battle-result { font-size: 13px; font-weight: bold; text-align: center; margin-top: 8px; padding: 4px; border-radius: 6px; }
        .battle-result.win { background: #2d5a27; color: #95ec69; }
        .battle-result.lose { background: #5a2727; color: #ff6b6b; }
        .battle-result.flee { background: #5a4a27; color: #ffd700; }
        .battle-result.ongoing { background: #2d4a5a; color: #9dd5ff; }
        .world-event { background: linear-gradient(135deg, #1a2a1a, #2a3a2a); border-left: 4px solid #7bc67e; border-radius: 8px; padding: 10px 14px; margin: 6px 0; font-style: italic; color: #b8e6b8; font-size: 13px; }
        .intervention-card { background: linear-gradient(135deg, #2d1b4e, #4a2d6e); border: 1px solid #7b5ea7; border-radius: 12px; padding: 12px; margin: 6px 0; color: #fff; }
        .intervention-card .intervention-desc { font-size: 13px; color: #d4b8e8; margin-bottom: 8px; }
        .intervention-btn { display: inline-block; background: linear-gradient(135deg, #6b3fa0, #8b5fc0); color: #fff; border: none; border-radius: 16px; padding: 6px 16px; margin: 4px; font-size: 13px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .intervention-btn:hover { background: linear-gradient(135deg, #8b5fc0, #ab7fe0); transform: scale(1.05); }
        .scene-tag { display: inline-block; background: rgba(255,255,255,0.15); color: #d4b8e8; border-radius: 10px; padding: 2px 10px; margin: 2px; font-size: 11px; white-space: nowrap; }
        .scene-tag.npc { background: rgba(255,107,157,0.25); color: #ff9dbf; }
        .scene-tag.conn { background: rgba(107,200,255,0.25); color: #9dd5ff; }
        .breakthrough-msg { background: linear-gradient(135deg, #4a2d6e, #6b3fa0); color: #ffd700; border-radius: 12px; padding: 12px; margin: 6px 0; text-align: center; font-weight: bold; font-size: 15px; }
        #input-bar { position: fixed; bottom: 0; width: 100%; height: 56px; background: #f7f7f7; border-top: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box; }
        #user-input { flex: 1; height: 36px; border: 1px solid #ddd; border-radius: 18px; padding: 0 14px; font-size: 14px; outline: none; background: #fff; }
        #send-btn { width: 56px; height: 36px; background: linear-gradient(135deg, #6b3fa0, #4a2d6e); color: white; border: none; border-radius: 18px; margin-left: 8px; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status-bar">
        <span class="stat"><span class="stat-label">地点</span> <span class="stat-value" id="p-loc">加载中</span></span>
        <span class="stat"><span class="stat-label">所务</span> <span class="stat-value" id="p-goal">—</span></span>
        <span class="stat"><span class="stat-label">境界</span> <span class="stat-value" id="p-level">练气期一层</span></span>
        <span class="stat"><span class="stat-label">灵力</span> <span class="stat-value" id="p-spirit">10</span></span>
        <span class="stat"><span class="stat-label">气血</span> <span class="stat-value" id="p-hp">100/100</span></span>
        <span class="stat"><span class="stat-label">攻</span> <span class="stat-value" id="p-atk">10</span></span>
        <span class="stat"><span class="stat-label">防</span> <span class="stat-value" id="p-def">10</span></span>
        <span class="stat" id="npc-rel" style="display:none"><span class="stat-label">师姐</span> <span class="stat-value" id="p-npc-stage">陌生</span> <span id="p-npc-fav" style="color:#ff6b9d">50</span></span>
        <div id="favorability-bar"><div id="favorability-fill" style="width:50%"></div></div>
        <div id="scene-info" style="display:none; width:100%; margin-top:2px;">
            <div id="scene-npcs" style="margin-top:2px;"></div>
            <div id="scene-connections" style="margin-top:2px;"></div>
        </div>
    </div>

    <div id="chat-container">
        <!-- Opening message is rendered dynamically by maybeShowIntro() from the player's current scene. -->
    </div>

    <div id="input-bar">
        <input type="text" id="user-input" placeholder="输入你的行动..." autocomplete="off">
        <button id="send-btn" onclick="sendAction()">发送</button>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8001' : '';

        const NPC_NAMES = {linwaner: '林婉儿', chenhao: '陈浩', old_yang: '杨老'};
        const SCENE_NAMES = {outer_gate: '外门', inner_gate: '内门', bamboo_forest: '竹林', market: '集市', mountain_range: '山脉'};

        // The opening line is shown once, on first status load, and must match
        // the player's actual scene — never a hardcoded outer_gate string.
        let introShown = false;
        // Last shown 所务 label, so we only surface a "所务更新" line when it changes.
        let lastGoalLabel = null;

        async function updateStatus() {
            try {
                const res = await fetch(`${API_URL}/player/status`);
                const data = await res.json();
                document.getElementById('p-loc').textContent = (data.scene && data.scene.name) || SCENE_NAMES[data.current_scene] || data.current_scene || '未知';
                document.getElementById('p-goal').textContent = (data.goal && data.goal.label) || '—';
                if (data.goal && data.goal.label) lastGoalLabel = data.goal.label;
                document.getElementById('p-level').textContent = data.level || '练气期一层';
                document.getElementById('p-spirit').textContent = data.spirit_power ?? 0;
                document.getElementById('p-hp').textContent = `${data.hp ?? 100}/${data.max_hp ?? 100}`;
                document.getElementById('p-atk').textContent = data.attack ?? 0;
                document.getElementById('p-def').textContent = data.defense ?? 0;

                // Scene info: NPCs present and connections
                const scene = data.scene;
                const sceneInfoEl = document.getElementById('scene-info');
                const npcsEl = document.getElementById('scene-npcs');
                const connsEl = document.getElementById('scene-connections');
                if (scene) {
                    sceneInfoEl.style.display = 'block';
                    if (scene.npcs_present && scene.npcs_present.length > 0) {
                        npcsEl.innerHTML = '<span class="stat-label">在场</span> ' +
                            scene.npcs_present.map(id => `<span class="scene-tag npc">${NPC_NAMES[id] || id}</span>`).join('');
                    } else {
                        npcsEl.innerHTML = '';
                    }
                    if (scene.connections && scene.connections.length > 0) {
                        connsEl.innerHTML = '<span class="stat-label">通道</span> ' +
                            scene.connections.map(id => `<span class="scene-tag conn">${SCENE_NAMES[id] || id}</span>`).join('');
                    } else {
                        connsEl.innerHTML = '';
                    }
                } else {
                    sceneInfoEl.style.display = 'none';
                }

                // Render the opening line once, matching the player's real scene.
                maybeShowIntro(data);
            } catch(e) {
                console.error('Status update failed:', e);
            }
        }

        function maybeShowIntro(data) {
            if (introShown) return;
            introShown = true;
            const scene = data.scene;
            const sceneName = (scene && scene.name) || SCENE_NAMES[data.current_scene] || data.current_scene || '青云门外门';
            const npcs = (scene && scene.npcs_present) || [];
            const conns = (scene && scene.connections) || [];
            // Hints reflect who is actually here and where the player can go.
            const hints = [];
            if (npcs.length) hints.push('和' + (NPC_NAMES[npcs[0]] || npcs[0]) + '说话');
            conns.slice(0, 2).forEach(c => hints.push('去' + (SCENE_NAMES[c] || c)));
            hints.push('修炼');
            const hintStr = `你想做什么？（试试：${hints.join('、')}）`;
            // Evocative cold-open only for a brand-new game at the outer gate;
            // otherwise a scene-aware line so the intro never contradicts reality.
            const prefix = (data.tick === 0 && data.current_scene === 'outer_gate')
                ? '【系统】你睁开眼，发现自己正躺在柴房的硬板床上。四周弥漫着霉味，窗外传来师兄们练剑的呼喊声。'
                : `【系统】你此刻身处${sceneName}，四下打量一番。`;
            const el = document.createElement('div');
            el.className = 'msg system';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = prefix + hintStr;
            el.appendChild(bubble);
            const container = document.getElementById('chat-container');
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function addBattleCard(container, combat) {
            const card = document.createElement('div');
            card.className = 'battle-card';
            const resultClass = combat.result === 'win' ? 'win'
                : combat.result === 'lose' ? 'lose'
                : combat.result === 'ongoing' ? 'ongoing' : 'flee';
            const resultText = combat.result === 'win' ? '胜'
                : combat.result === 'lose' ? '败'
                : combat.result === 'ongoing' ? '交战中' : '撤退';
            card.innerHTML = `
                <h3>⚔ ${combat.enemy}</h3>
                <div class="battle-row"><span>造成伤害</span><span>${combat.dmg_to_enemy}</span></div>
                <div class="battle-row"><span>受到伤害</span><span>${combat.dmg_to_player}</span></div>
                <div class="battle-row"><span>敌方剩余</span><span>${combat.enemy_remaining_hp} HP</span></div>
                <div class="battle-row"><span>我方剩余</span><span>${combat.player_remaining_hp} HP</span></div>
                <div class="battle-result ${resultClass}">${resultText}</div>
            `;
            container.appendChild(card);
        }

        function addBreakthroughMsg(container, bt) {
            const msg = document.createElement('div');
            msg.className = 'breakthrough-msg';
            msg.textContent = `🌟 突破！${bt.from} → ${bt.to} 🌟`;
            container.appendChild(msg);
        }

        function addWorldEvent(container, worldEvent) {
            if (!worldEvent) return;
            const el = document.createElement('div');
            el.className = 'world-event';
            const name = worldEvent.name || '';
            const text = name ? `◈ ${name}` : '◈ 世界事件';
            el.textContent = text;
            container.appendChild(el);
        }

        function addIntervention(container, intervention) {
            if (!intervention) return;
            const card = document.createElement('div');
            card.className = 'intervention-card';
            const desc = document.createElement('div');
            desc.className = 'intervention-desc';
            desc.textContent = intervention.description || '你可以选择：';
            card.appendChild(desc);
            const options = intervention.options || [];
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'intervention-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => {
                    document.getElementById('user-input').value = opt;
                    sendAction();
                });
                card.appendChild(btn);
            });
            container.appendChild(card);
        }

        function updateFavorability(npc) {
            if (!npc) return;
            document.getElementById('npc-rel').style.display = 'inline';
            document.getElementById('favorability-bar').style.display = 'block';
            document.getElementById('p-npc-stage').textContent = npc.relationship_stage || '陌生';
            document.getElementById('p-npc-fav').textContent = npc.favorability ?? 50;
            document.getElementById('favorability-fill').style.width = `${npc.favorability ?? 50}%`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendAction() {
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';

            const container = document.getElementById('chat-container');

            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            container.appendChild(userMsg);

            // AI response placeholder
            const aiMsgEl = document.createElement('div');
            aiMsgEl.className = 'msg system';
            const aiBubbleEl = document.createElement('div');
            aiBubbleEl.className = 'bubble';
            aiBubbleEl.innerText = '正在思考...';
            aiMsgEl.appendChild(aiBubbleEl);
            container.appendChild(aiMsgEl);
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/game/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                    aiBubbleEl.innerText = fullText;
                    container.scrollTop = container.scrollHeight;
                }

                // Try to parse JSON response
                try {
                    let cleanJson = fullText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(cleanJson);

                    // Show story text (fallback if empty)
                    aiBubbleEl.innerText = result.story || '（你的行动似乎没有引起什么变化……）';

                    // Show battle card if combat
                    if (result.combat) {
                        addBattleCard(container, result.combat);
                    }

                    // Show breakthrough if present
                    if (result.breakthrough) {
                        addBreakthroughMsg(container, result.breakthrough);
                    }

                    // Show world event if present
                    if (result.world_event) {
                        addWorldEvent(container, result.world_event);
                    }

                    // Show intervention options if present
                    if (result.intervention) {
                        addIntervention(container, result.intervention);
                    }

                    // Surface a 所务 (objective) update line when the goal advances.
                    if (result.goal && result.goal.label && result.goal.label !== lastGoalLabel) {
                        const goalEl = document.createElement('div');
                        goalEl.className = 'msg system';
                        const goalBubble = document.createElement('div');
                        goalBubble.className = 'bubble';
                        goalBubble.textContent = `【所务】${result.goal.label}`;
                        goalEl.appendChild(goalBubble);
                        container.appendChild(goalEl);
                        lastGoalLabel = result.goal.label;
                    }

                    // Update favorability if NPC data present
                    if (result.npc) {
                        updateFavorability(result.npc);
                    }

                    // Update status bar
                    await updateStatus();

                } catch(e) {
                    // Fallback: show raw text
                    console.log('JSON parse failed, showing raw text', e);
                }

            } catch (err) {
                aiBubbleEl.innerText = '【系统】传信飞鸽在半路被雷劈了，请重试。';
            }
        }

        // Handle Enter key
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendAction();
        });

        // Initial status load
        updateStatus();
    </script>
</body>
</html>
